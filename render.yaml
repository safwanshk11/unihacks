services:
  - type: web
    name: lumen-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LLM_BACKEND
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://lumen-console.onrender.com

  - type: web
    name: lumen-console
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://lumen-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
